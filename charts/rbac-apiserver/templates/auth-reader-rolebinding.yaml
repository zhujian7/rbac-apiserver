apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rbac-apiserver.fullname" . }}-auth-reader
  namespace: kube-system
  labels:
    {{- include "rbac-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
- kind: ServiceAccount
  name: {{ include "rbac-apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
