apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rbac-apiserver.fullname" . }}-auth-delegator
  labels:
    {{- include "rbac-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ include "rbac-apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
