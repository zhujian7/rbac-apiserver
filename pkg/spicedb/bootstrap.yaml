schema: |-
  definition user {}

  definition group {
    relation member: user
  }

  definition resource {
    relation admin: user | group#member
    relation viewer: user | group#member
    relation editor: user | group#member
    
    permission view = viewer + editor + admin
    permission edit = editor + admin
  }

  definition cluster {
    relation admin: user | group#member
    relation viewer: user | group#member
    relation editor: user | group#member
    
    permission view = viewer + editor + admin
    permission edit = editor + admin
  }

  definition namespace {
    relation parent: cluster
    relation admin: user | group#member
    relation viewer: user | group#member
    relation editor: user | group#member

    permission view = viewer + editor + admin + parent->view
    permission edit = editor + admin + parent->edit
  }

relationships: |-
  // Default admin relationships can be added here
