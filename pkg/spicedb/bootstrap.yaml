schema: |-
  definition user {}

  definition group {
    relation member: user
  }

  definition resource {
    relation admin: user | group#member
    relation viewer: user | group#member
    permission view = viewer + admin
    permission edit = admin
  }

  definition cluster {
    relation admin: user | group#member
    relation viewer: user | group#member
    permission view = viewer + admin
    permission edit = admin
  }

  definition namespace {
    relation parent: cluster
    relation admin: user | group#member
    relation viewer: user | group#member
    permission view = viewer + admin + parent->view
    permission edit = admin + parent->edit
  }

relationships: |-
  // Default admin relationships can be added here