---
# Native Kubernetes RBAC for charlie on the managed cluster
# This demonstrates that when auth-server returns NoOpinion,
# the native Kubernetes RBAC evaluates the request
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: charlie-pod-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: charlie-pod-reader-binding
  namespace: default
subjects:
- kind: User
  name: charlie
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: charlie-pod-reader
  apiGroup: rbac.authorization.k8s.io
