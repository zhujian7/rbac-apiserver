apiVersion: authorization.open-cluster-management.io/v1alpha1
kind: PermissionBinding
metadata:
  name: charlie-other-cluster-permissions
spec:
  subject:
    kind: User
    name: charlie
  permissions:
  # Charlie has permissions on cluster3, not cluster1
  # This will cause auth-server to return NoOpinion for requests to cluster1
  # This demonstrates cluster-specific permission enforcement
  - resources: ["pods"]
    groups: [""]
    namespaces: ["default"]
    names: ["*"]
    role: "admin"
    clusters: ["cluster3"]
